name: 02 - Test Default AST Action (SSC)

on:
  workflow_dispatch:

jobs:
  ast-default-ssc:
    runs-on: ubuntu-22.04-arm
    environment: SSC
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Fortify AST scan (default action)
        uses: fortify/github-action@main
        with:
          debug-artifact-password: ${{ secrets.FORTIFY_DEBUG_ARTIFACT_PASSWORD }}
        env:
          FCLI_BOOTSTRAP_VERSION: dev_v3.x
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          SSC_APPVERSION: 00011:githubaction
          AVIATOR_URL: https://aviator-qa02.fod-forge.cyberreseng.com
          AVIATOR_TOKEN: ${{ secrets.AVIATOR_TOKEN }}
          DO_AVIATOR_AUDIT: false
          DO_AVIATOR_REMEDIATIONS: false
          AVIATOR_APP: TOOLS_TENANT
